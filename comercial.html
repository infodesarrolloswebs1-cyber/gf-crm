<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GF - Panel Comercial v15.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #020617; --sidebar: #0f172a; --accent: #3b82f6; --green: #22c55e; --card: #1e293b; --red: #ef4444; --text-dim: #94a3b8; --border: #334155; --orange: #f59e0b; --purple: #a855f7; --cyan: #06b6d4; }
        body { margin:0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }
        nav { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; shrink: 0; }
        nav h2 { font-size: 18px; margin-bottom: 30px; color: var(--accent); font-weight: 800; }
        nav button { background: none; border: none; color: var(--text-dim); padding: 12px; text-align: left; cursor: pointer; border-radius: 10px; margin-bottom: 8px; transition: 0.3s; font-weight: 500; }
        nav button.active { background: var(--card); color: white; border-left: 4px solid var(--accent); }
        main { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .section { display: none; }
        .section.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: var(--card); padding: 22px; border-radius: 15px; border: 1px solid var(--border); }
        .stat-card h2 { margin: 8px 0 0; color: var(--green); font-size: 28px; }
        .form-container { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 40px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-row { grid-column: span 2; }
        .form-section-title { grid-column: span 2; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 20px 0 10px; color: var(--accent); font-size: 13px; font-weight: 800; text-transform: uppercase; }
        label { display: block; font-size: 11px; color: var(--text-dim); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        input, textarea, select { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; width: 100%; box-sizing: border-box; }
        .btn-main { background: var(--accent); border: none; color: white; padding: 16px; border-radius: 10px; cursor: pointer; font-weight: 800; width: 100%; margin-top: 20px; text-transform: uppercase; }
        .pipeline { display: flex; gap: 20px; align-items: flex-start; }
        .col { flex: 1; background: #020617; padding: 15px; border-radius: 18px; border: 1px solid var(--border); min-height: 400px; }
        .col h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; border-bottom: 2px solid var(--sidebar); padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .card { background: var(--card); padding: 18px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; position: relative; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; margin-right: 5px; }
        .btn-delete-mini { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; opacity: 0.2; }
        .card:hover .btn-delete-mini { opacity: 1; }
        .table-container { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background: #1e293b; }
        th { padding: 18px; font-size: 12px; color: var(--accent); }
        td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 14px; }
        #modalLead { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2, 6, 23, 0.95); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:var(--sidebar); padding:35px; border-radius:24px; width:680px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
        
        /* Estilos nuevos para Checkboxes */
        .grid-etiquetas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; }
        .grid-etiquetas label { text-transform: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #e2e8f0; }
        .grid-etiquetas input { width: auto; }
    </style>
</head>
<body>
<nav>
    <h2>GF COMERCIAL</h2>
    <button id="btn-ventas" class="active" onclick="switchTab('ventas')">📊 Pipeline Ventas</button>
    <button id="btn-comisiones" onclick="switchTab('comisiones')">💰 Mis Comisiones</button>
    <button id="btn-status" onclick="switchTab('status')">🛠️ Estado de Fábrica</button>
    <button onclick="cerrarSesion()" style="margin-top:auto; color:var(--red)">🚪 Cerrar Sesión</button>
</nav>

<main>
    <div id="tab-ventas" class="section active">
        <div class="stats-grid">
            <div class="stat-card"><span>Pipeline Potencial</span><h2 id="pipTotal">USD 0</h2></div>
            <div class="stat-card"><span>Ventas Cerradas</span><h2 id="ventasCerradas">0</h2></div>
        </div>
        
        <div class="form-container">
            <h3>📝 Datos para Propuesta</h3>
            <div class="form-grid">
                <div class="form-section-title">Información del Cliente</div>
                <div><label>Nombre del Cliente</label><input id="fNombre" placeholder="Bruno Campelleno"></div>
                <div><label>WhatsApp</label><input id="fWhatsapp" placeholder="+54 9 ..."></div>
                <div><label>Empresa / Nombre App</label><input id="fEmpresa" placeholder="Nombre de la app"></div>
                <div><label>¿Toma la decisión solo?</label><select id="fSolo"><option value="si">Sí</option><option value="no">No</option></select></div>
                <div><label>¿Tiene socio?</label><select id="fSocio"><option value="no">No</option><option value="si">Sí</option></select></div>
                <div><label>Provincia/Estado</label><input id="fProvincia" placeholder="Cordoba"></div>
                <div><label>País</label><input id="fPais" placeholder="Argentina"></div>
                <div><label>Presupuesto Estimado (USD)</label><input id="fMonto" type="number" placeholder="16000"></div>

                <div class="form-section-title">Detalles del Proyecto</div>
                <div class="full-row"><label>Tipo de Proyecto</label><input id="fTipo" placeholder="App móvil, SaaS, etc."></div>
                <div class="full-row"><label>Problema que busca resolver</label><textarea id="fProblema"></textarea></div>
                <div class="full-row"><label>Usuarios del sistema</label><input id="fUsuarios" placeholder="Admin, Cliente, Conductor..."></div>
                <div class="full-row"><label>Plataformas</label><input id="fPlataformas" placeholder="iOS, Android, Panel"></div>
                <div class="full-row"><label>Funciones Principales</label><textarea id="fFunciones"></textarea></div>
                <div class="full-row"><label>Integraciones necesarias</label><input id="fIntegraciones" placeholder="Pagos, Maps, WhatsApp..."></div>
                
                <div class="form-section-title">Branding & Observaciones</div>
                <div><label>¿Tiene Branding?</label><select id="fBranding"><option value="no">No</option><option value="si">Sí</option></select></div>
                <div><label>Competencia de referencia</label><input id="fCompetencia" placeholder="Cabify, Uber..."></div>
                <div class="full-row"><label>Expectativa de Entrega Cliente</label><input id="fTiempo" placeholder="6 meses"></div>
                <div class="full-row"><label>Observaciones Extras</label><textarea id="fObservaciones" placeholder="Notas adicionales..."></textarea></div>
            </div>
            <button class="btn-main" onclick="agregarLead()">+ FINALIZAR Y CARGAR LEAD</button>
        </div>

        <div class="pipeline">
            <div class="col" id="col-nuevo"><h3>INGRESADO</h3></div>
            <div class="col" id="col-consultoria"><h3>CONSULTORÍA</h3></div>
            <div class="col" id="col-contrato"><h3>CONTRATO</h3></div>
            <div class="col" id="col-produccion"><h3>PRODUCCIÓN</h3></div>
        </div>
    </div>

    <div id="tab-comisiones" class="section">
        <div class="table-container">
            <table>
                <thead><tr><th>Cliente</th><th>Monto Total</th><th>Cobrado</th><th>Mi Comisión</th><th>Saldo</th></tr></thead>
                <tbody id="listaComisiones"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-status" class="section">
        <div class="table-container">
            <table>
                <thead><tr><th>Cliente</th><th>Fase</th><th>Hito</th><th>Notas CTO</th></tr></thead>
                <tbody id="listaStatus"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="modalLead">
    <div class="modal-content">
        <div id="area-imprimible">
            <h2 id="mNombre" style="margin-top:0; color:var(--accent);"></h2>
            <div id="mDetalleTexto" style="font-size:13px; color:var(--text-dim); line-height:1.5"></div>
        </div>
        <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            
            <label style="color:var(--accent); margin-bottom:10px;">ETIQUETAS DE SEGUIMIENTO (MÚLTIPLES):</label>
            <div class="grid-etiquetas">
                <label><input type="checkbox" value="caliente" class="tag-check"> 🚀 Caliente</label>
                <label><input type="checkbox" value="tibio" class="tag-check"> 🔥 Tibio</label>
                <label><input type="checkbox" value="frio" class="tag-check"> ❄️ Frío</label>
                <label><input type="checkbox" value="espera" class="tag-check"> ⏳ Espera</label>
                <label><input type="checkbox" value="nuevo" class="tag-check"> 🆕 Calificado</label>
                <label><input type="checkbox" value="r1" class="tag-check"> 📞 R1 Comercial</label>
                <label><input type="checkbox" value="envie_pres" class="tag-check"> 📄 Pres. Enviada</label>
                <label><input type="checkbox" value="r2" class="tag-check"> 🖥️ R2 CTO</label>
                <label><input type="checkbox" value="r3" class="tag-check"> 🤝 R3 Cierre</label>
                <label><input type="checkbox" value="firmo_nda" class="tag-check"> 🖊️ NDA Firmado</label>
            </div>
            <button class="btn-main" style="background:var(--accent); margin-bottom:15px; padding:10px;" onclick="guardarEtiquetasMultiples()">💾 APLICAR ETIQUETAS</button>

            <p id="mInstrucciones" style="color:var(--accent); font-weight:bold; font-size:12px;"></p>
            <input id="mLinkPDF" placeholder="Link Propuesta PDF" style="display:none; margin-bottom:15px;">
            
            <div style="display:flex; gap:10px; flex-wrap: wrap;">
                <button class="btn-main" id="btnAvanzar" style="margin-top:0; flex:1;">AVANZAR ETAPA</button>
                <button class="btn-main" style="background:var(--green); margin-top:0; flex:1;" onclick="descargarPDF()">📥 PDF</button>
                <button class="btn-main" style="background:#475569; margin-top:0; flex:1;" onclick="habilitarEdicion()">✏️ EDITAR</button>
                <button class="btn-main" style="background:transparent; border:1px solid #334155; margin-top:0; flex:1;" onclick="cerrarModal()">CERRAR</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="comercial.js"></script>
<script>
    function switchTab(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    }
</script>
</body>
</html>
