<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GF - Panel CTO (Producción v7.0)</title>
    <style>
        :root { --bg: #020617; --sidebar: #0f172a; --accent: #8b5cf6; --green: #22c55e; --card: #1e293b; --red: #ef4444; --text-dim: #94a3b8; }
        body { margin:0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }
        nav { width: 260px; background: var(--sidebar); border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 25px; shrink: 0; }
        nav h2 { font-size: 18px; margin-bottom: 30px; color: var(--accent); font-weight: 800; }
        nav button { background: none; border: none; color: var(--text-dim); padding: 12px; text-align: left; cursor: pointer; border-radius: 10px; margin-bottom: 8px; transition: 0.3s; }
        nav button.active { background: #1e293b; color: white; border-left: 4px solid var(--accent); }
        main { flex: 1; overflow-y: auto; padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: var(--card); padding: 22px; border-radius: 15px; border: 1px solid #334155; }
        .stat-card span { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; }
        .stat-card h2 { margin: 8px 0 0; color: var(--accent); }
        .pipeline { display: flex; gap: 15px; align-items: flex-start; }
        .col { flex: 1; background: #020617; padding: 15px; border-radius: 15px; border: 1px solid #1e293b; min-height: 550px; }
        .col h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 15px; }
        .card { background: var(--card); padding: 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #334155; cursor: pointer; }
        .card:hover { border-color: var(--accent); }
        #modalCTO { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:var(--sidebar); padding:30px; border-radius:20px; width:550px; border: 1px solid var(--accent); max-height: 90vh; overflow-y: auto; }
        .btn-cto { background: var(--accent); border: none; color: white; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-cto:hover { transform: scale(1.02); }
        textarea, input { width: 100%; background: #020617; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>
<nav>
    <h2>GF CTO</h2>
    <button class="active">🚀 Producción</button>
    <button onclick="cerrarSesion()" style="margin-top:auto; color:var(--red)">🚪 Cerrar Sesión</button>
</nav>
<main>
    <div class="stats-grid">
        <div class="stat-card"><span>Carga de Equipo</span><h2 id="cargaTotal">0 / 5</h2></div>
        <div class="stat-card"><span>Proyectos Entregados</span><h2 id="countEntregados">0</h2></div>
    </div>
    <div class="pipeline">
        <div class="col" id="col-Diseño"><h3>DISEÑO</h3></div>
        <div class="col" id="col-Desarrollo"><h3>DESARROLLO</h3></div>
        <div class="col" id="col-Testing"><h3>TESTING</h3></div>
        <div class="col" id="col-Entregado"><h3 style="color:var(--green)">ENTREGADO</h3></div>
    </div>
</main>

<div id="modalCTO">
    <div class="modal-content">
        <h3 id="pNombre">Proyecto</h3>
        <p><strong>Ficha Técnica:</strong></p>
        <div id="pIdea" style="background:#020617; padding:15px; border-radius:10px; margin-bottom:20px; font-size:13px; color:#e2e8f0; line-height:1.6; max-height:150px; overflow-y:auto;"></div>
        
        <div id="formEntrega" style="display:none; border-top: 2px solid var(--green); padding-top: 15px; margin-top: 15px;">
            <h4 style="color:var(--green)">Documentación de Entrega Llave en Mano</h4>
            <label>Fecha de Entrega Real:</label>
            <input type="date" id="pFechaEntrega">
            <label>Accesos y Credenciales (Hosting, BD, Admin):</label>
            <textarea id="pAccesos" placeholder="Lista de credenciales transferidas al cliente..."></textarea>
        </div>

        <label style="display:block; margin-top:10px;"><strong>Bitácora de Avance (Comercial lo verá):</strong></label>
        <textarea id="pNotas" placeholder="Escribe aquí el estatus actual o notas de la sub-etapa..."></textarea>
        
        <div style="margin-top:25px; display:flex; gap:10px; justify-content: center; flex-wrap: wrap;">
            <button class="btn-cto" style="background:#475569" onclick="guardarNotasSolo()">💾 GUARDAR NOTAS</button>
            <button class="btn-cto" id="btnAvanzarTec">AVANZAR ETAPA ➡️</button>
            <button class="btn-cto" style="background:transparent; border:1px solid #334155" onclick="cerrarModal()">CERRAR</button>
        </div>
    </div>
</div>

<script type="module" src="cto.js"></script>
<script>
    function cerrarSesion() { window.location.href = "index.html"; }
</script>
</body>
</html>
