<!DOCTYPE html>
<html>
<head>
  <title>GF CRM Dashboard</title>

  <style>
body{
  font-family: Arial;
  background:#f1f3f7;
  padding:20px;
}

.pipeline{
  display:flex;
  gap:20px;
}

.col{
  background:white;
  padding:15px;
  width:25%;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.card{
  background:#fff;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ddd;
}
</style>

</head>
<body>

<h1>GF CRM DASHBOARD</h1>

<button onclick="logout()">Cerrar sesión</button>

<hr>

<button onclick="crearCliente()">Crear cliente</button>

  <h3>Clientes</h3>
<div id="listaClientes"></div>

<hr>

<h2>PIPELINE VENTAS</h2>

<div class="pipeline">

  <div class="col" data-estado="nuevo">
    <h3>Nuevo</h3>
    <div class="dropzone" id="col-nuevo"></div>
  </div>

  <div class="col" data-estado="reunion">
    <h3>Reunión</h3>
    <div class="dropzone" id="col-reunion"></div>
  </div>

  <div class="col" data-estado="propuesta">
    <h3>Propuesta</h3>
    <div class="dropzone" id="col-propuesta"></div>
  </div>

  <div class="col" data-estado="cerrado">
    <h3>Cerrado</h3>
    <div class="dropzone" id="col-cerrado"></div>
  </div>

</div>

<hr>

<h2>Leads</h2>

<input id="leadNombre" placeholder="Nombre">
<input id="leadEmpresa" placeholder="Empresa">
<input id="leadMonto" placeholder="Monto USD">

<button onclick="crearLead()">Guardar lead</button>

<div id="listaLeads"></div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
