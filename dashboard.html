<!DOCTYPE html>
<html>
<head>
  <title>GF DESARROLLOS - Enterprise Suite</title>
  <style>
    :root { --bg: #020617; --sidebar: #0f172a; --accent: #3b82f6; --green: #22c55e; --card: #1e293b; }
    body { margin:0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; }
    
    /* SIDEBAR */
    nav { width: 250px; background: var(--sidebar); border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 20px; }
    nav h2 { font-size: 18px; margin-bottom: 30px; color: var(--accent); }
    nav button { background: none; border: none; color: #94a3b8; padding: 12px; text-align: left; cursor: pointer; border-radius: 8px; font-size: 15px; margin-bottom: 5px; }
    nav button:hover, nav button.active { background: #1e293b; color: white; }

    /* MAIN CONTENT */
    main { flex: 1; overflow-y: auto; padding: 30px; }
    .section { display: none; }
    .section.active { display: block; }
    
    /* REUTILIZABLE STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .stat-card span { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-card h2 { margin: 10px 0 0; font-size: 24px; }
    
    /* TABLAS ESTILO COO */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--sidebar); border-radius: 12px; overflow: hidden; }
    th { text-align: left; padding: 15px; background: #1e293b; color: #94a3b8; font-size: 13px; }
    td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <h2>GF DESARROLLOS</h2>
  <button class="active" onclick="showSection('crm')">📊 CRM Pipeline</button>
  <button onclick="showSection('proyectos')">🚀 Operaciones</button>
  <button onclick="showSection('finanzas')">💰 Finanzas / Pagos</button>
  <button onclick="showSection('marketing')">📈 Ads & ROI</button>
  <div style="margin-top: auto;">
    <button onclick="logout()" style="color: #ef4444;">🚪 Cerrar Sesión</button>
  </div>
</nav>

<main>
  <div id="crm" class="section active">
    <div class="stats-grid">
      <div class="stat-card"><span>Pipeline</span><h2 id="totalPipeline">USD 0</h2></div>
      <div class="stat-card"><span>Cierres Mes</span><h2 id="ventasMes">USD 0</h2></div>
      <div class="stat-card"><span>Ticket Promedio</span><h2>USD 16k</h2></div>
      <div class="stat-card"><span>Rentabilidad</span><h2 id="rentabilidad">0%</h2></div>
    </div>
    </div>

  <div id="proyectos" class="section">
    <h1>Operaciones: Proyectos en Curso</h1>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Estado</th>
          <th>Progreso Hitos</th>
          <th>Fecha Entrega</th>
          <th>Saldo Pendiente</th>
        </tr>
      </thead>
      <tbody id="lista-proyectos">
        </tbody>
    </table>
  </div>

  <div id="finanzas" class="section">
    <h1>Caja y Comisiones</h1>
    <div class="stats-grid">
      <div class="stat-card"><span>Total Cobrado</span><h2 style="color:var(--green)">USD 0</h2></div>
      <div class="stat-card"><span>Comisiones x Pagar</span><h2 style="color:#f59e0b">USD 0</h2></div>
    </div>
  </div>
</main>

<script type="module" src="dashboard.js"></script>
<script>
  function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
  }
</script>
</body>
</html>
